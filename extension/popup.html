<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 350px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .logo {
      font-size: 24px;
      margin-bottom: 5px;
    }
    
    .title {
      font-size: 18px;
      font-weight: bold;
      color: #333;
      margin: 0;
    }
    
    .subtitle {
      font-size: 14px;
      color: #666;
      margin: 5px 0 0 0;
    }
    
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }
    
    .stat-card {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
    }
    
    .stat-number {
      font-size: 24px;
      font-weight: bold;
      color: #333;
    }
    
    .stat-label {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }
    
    .status {
      background: #e8f5e8;
      border: 1px solid #4caf50;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 15px;
      text-align: center;
    }
    
    .status.warning {
      background: #fff3e0;
      border-color: #ff9800;
    }
    
    .status.error {
      background: #ffebee;
      border-color: #f44336;
    }
    
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .btn {
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 15px;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
      text-align: center;
      transition: background-color 0.2s;
    }
    
    .btn:hover {
      background: #0056b3;
    }
    
    .btn.secondary {
      background: #6c757d;
    }
    
    .btn.secondary:hover {
      background: #545b62;
    }
    
    .recent-analysis {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #eee;
    }
    
    .analysis-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    
    .analysis-item:last-child {
      border-bottom: none;
    }
    
    .analysis-score {
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
    }
    
    .score-safe {
      background: #d4edda;
      color: #155724;
    }
    
    .score-suspicious {
      background: #fff3cd;
      color: #856404;
    }
    
    .score-unsafe {
      background: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🛡️</div>
    <h1 class="title">PhishNet</h1>
    <p class="subtitle">Real-time email protection</p>
  </div>
  
  <div id="status" class="status">
    <div id="status-text">🔍 Monitoring emails...</div>
  </div>
  
  <div class="stats">
    <div class="stat-card">
      <div class="stat-number" id="emails-scanned">0</div>
      <div class="stat-label">Emails Scanned</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="threats-blocked">0</div>
      <div class="stat-label">Threats Blocked</div>
    </div>
  </div>
  
  <div class="buttons">
    <a href="http://localhost:5000" target="_blank" class="btn">
      📊 Open Dashboard
    </a>
    <button id="toggle-protection" class="btn secondary">
      ⏸️ Pause Protection
    </button>
    <button id="clear-data" class="btn secondary">
      🗑️ Clear Data
    </button>
  </div>
  
  <div class="recent-analysis">
    <h3 style="margin: 0 0 10px 0; font-size: 14px; color: #333;">Recent Analysis</h3>
    <div id="recent-list">
      <div style="text-align: center; color: #666; font-size: 12px; padding: 20px 0;">
        No recent analysis
      </div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
